# Metadata (single source of truth for web + desktop registries)
[copyright]
holder = "RF EXIF contributors"
license = "Apache-2.0"

[camera]
id = "canon-r8"
label = "Canon EOS R8"
models = ["\\bEOS R8\\b"]
version = 1

# ExifTool decodes CameraInfo 0x0D29 into a plain ShutterCount. Web-only:
# desktop is USB-only.
[[strategy]]
kind = "exif-tag"
tag = "ShutterCount"
platforms = ["web"]
experimental = true
note = "Native EXIF ShutterCount (CameraInfo 0x0D29). Experimental until 3+ consecutive originals confirm."
