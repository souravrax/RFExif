# Metadata (single source of truth for web + desktop registries)
[copyright]
holder = "ShutterDrop contributors"
license = "Apache-2.0"

[camera]
id = "canon-r10"
label = "Canon EOS R10"
models = ["\\bEOS R10\\b", "\\bR10\\b"]
rated_life = 100000
version = 1

# Total actuation counter (mechanical + EFCS + electronic).
# CanonCameraInfo blob (CR3 CTMD rec.8 -> TIFF 0x000D, JPG MakerNote 0x0D),
# magic BB CC 00 00, LE uint32 at blob-relative 0xC93.
[[strategy]]
kind = "blob-scan"
magic = "BBCC0000"
offset = 0xC93
format = "u32le"
source = "r10-blob"
platforms = ["web", "desktop"]
experimental = true
note = "Total mechanical + electronic combined. Validated 22146-22165 on 14 consecutive shots."
