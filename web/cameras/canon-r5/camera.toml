# Metadata (single source of truth for web + desktop registries)
[copyright]
holder = "RF EXIF contributors"
license = "Apache-2.0"

[camera]
id = "canon-r5"
label = "Canon EOS R5"
# Negative lookahead keeps "EOS R5 Mark II" on its own manifest.
models = ["\\bEOS R5(?! Mark)\\b"]
version = 1

# ExifTool decodes CameraInfo 0x0AF1 into a plain ShutterCount (verified
# via the ExifTool-WASM enrichment path). Web-only: desktop is USB-only.
[[strategy]]
kind = "exif-tag"
tag = "ShutterCount"
platforms = ["web"]
experimental = true
note = "Native EXIF ShutterCount (CameraInfo 0x0AF1). Experimental until 3+ consecutive originals confirm."
