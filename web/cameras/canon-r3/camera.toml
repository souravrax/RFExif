# Metadata (single source of truth for web + desktop registries)
[copyright]
holder = "RF EXIF contributors"
license = "Apache-2.0"

[camera]
id = "canon-r3"
label = "Canon EOS R3"
models = ["\\bEOS R3\\b"]
version = 1

# ExifTool decodes the R3 counter into a plain ShutterCount. Web-only:
# desktop is USB-only.
[[strategy]]
kind = "exif-tag"
tag = "ShutterCount"
platforms = ["web"]
experimental = true
note = "Native EXIF ShutterCount. Experimental until 3+ consecutive originals confirm."
