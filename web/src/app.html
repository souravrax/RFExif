<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('rfexif-theme'); } catch {}
        document.documentElement.dataset.theme = theme === 'dark' || theme === 'light' ? theme : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      })();
    </script>
    <link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/brand/favicon.svg" />
    <meta name="description" content="Free camera and lens insights for Canon EOS R. Explore photo metadata and available shutter counts locally in your browser. No account or uploads required." />
    <meta name="theme-color" content="#ffe0c9" />
    <title>RF EXIF — Free Camera Insights for Canon EOS R</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
